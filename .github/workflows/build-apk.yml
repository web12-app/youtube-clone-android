name: Build APK and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f ./gradlew ]; then
            # Create a basic gradlew if missing (fallback)
            echo "No gradlew found - using gradle wrapper generation"
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: |
          # Use gradle directly if no wrapper
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace || true
            # Fallback: try with wrapper generation
            gradle wrapper --gradle-version 8.2
            ./gradlew assembleDebug --stacktrace
          fi
        continue-on-error: true

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK" ]; then
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
            ls -lh "$APK"
          else
            echo "No APK found"
            echo "apk_path=" >> $GITHUB_OUTPUT
          fi

      - name: Create source zip
        run: |
          zip -r youtube-clone-android-source.zip . -x "*.git*" -x "*build*" -x "*.apk" -x "*local.properties"
          ls -lh youtube-clone-android-source.zip

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## YouTube Clone Android
            
            - Source code zip
            - Debug APK (if build succeeded)
            
            Built automatically via GitHub Actions.
          files: |
            youtube-clone-android-source.zip
            ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
